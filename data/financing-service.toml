# Where the REST API listens (default "127.0.0.1:8080"). mapi-lite defaults
# to 8080 too: running both on one host, move this one; Event's regtest config
# expects 8081. The Docker image sets FS__LISTEN_ADDR=0.0.0.0:8080.
listen_addr = "127.0.0.1:8080"

[blockchain_interface]
# Read through the [mapi_lite] server below, so it is the deployment's only
# WhatsOnChain client and paces for WhatsOnChain's one free 3 requests a
# second (CS-635). mainnet and testnet only; needs [mapi_lite].
interface_type = "mapi_lite"
network = "testnet"
# Or read WhatsOnChain directly. With [mapi_lite] on mainnet or testnet this is
# warned about at startup: only if mapi-lite runs without [woc] does it stay
# within the free quota.
# interface_type = "woc"
# For a local node, the only way to reach regtest. The service imports each
# client's address into the node's wallet so their balances are visible.
# interface_type = "rpc"
# network = "regtest"
# url = "127.0.0.1:18332"   # bitcoin-sv's regtest RPC port (Bitcoin Core's is 18443)
# rpc_user = "rpcuser"
# rpc_password = "env:FS_RPC_PASSWORD"
# rpc_import_addresses = true
# Ceiling on outbound requests to the blockchain interface. Defaults to 3 for
# woc, which documents "up to 3 requests/sec is free" and answers 429 above it;
# unset for rpc and uaas, which are your own servers. 0 turns it off.
# max_requests_per_second = 3
# Deadline on each call to the interface, in seconds; 0 turns it off.
# timeout_seconds = 30
# url = "http://localhost:5010"

[web_interface]
# Shared secret required on POST /client. On mainnet and testnet the service
# will not start without one, and every client needs an api_key (CS-514);
# elsewhere, without it POST /client is unauthenticated and a warning is logged
# at startup. Prefer the environment: an env: reference, or
# FS__WEB_INTERFACE__ADMIN_API_KEY (any setting takes an FS__<TABLE>__<KEY>
# override, CS-624).
# admin_api_key = "env:FS_ADMIN_API_KEY"
# Only if a gateway in front of this service authenticates callers:
# allow_unauthenticated = true
# [web_interface.rate_limit]
# enabled = true
# requests_per_second = 10
# burst_size = 20
# Proxies whose X-Forwarded-For is believed when limiting by client address.
# trusted_proxies = ["10.0.0.1"]

# The log level is RUST_LOG's (default "info"), as for Event and mapi-lite.

# [telemetry]
# enabled = true
# service_name = "financing-service-rs"
# otlp_endpoint = "http://localhost:4317"
# export_interval_sec = 60                 # metrics only; OTEL_METRIC_EXPORT_INTERVAL overrides
# resource_attributes = { "deployment.environment.name" = "local" }

[service]
utxo_refresh_period = 60
# How old cached chain state may be before a request refreshes it. Defaults to
# utxo_refresh_period, so a request reuses what the periodic refresh last
# fetched. Lower it to narrow the window in which the service can build on a
# view something outside it has moved on from; 0 refreshes on every request.
# chain_state_max_age_seconds = 60
# How old a client's last successful chain read may be before GET /ready reports
# the service unready. Defaults to 3 x utxo_refresh_period, and never under 60;
# 0 turns the check off.
# ready_max_chain_read_age_seconds = 180
# What the service has broadcast but the chain may not have caught up with --
# the inputs it has spent and the change it has created -- is written here after
# every funding commit and read back at startup, so a restart does not rebuild
# transactions it has just sent. Defaults beside dynamic_config.filename, named
# after it; it must survive a restart just as that file does.
# inflight_state_file = "./data/dynamic.inflight.json"

[dynamic_config]
filename = "./data/dynamic.toml"
# POST /client stores env:VAR references only; a raw wif is refused unless this
# is set, since the file would then hold the key itself. Development only.
# allow_plaintext_wif = false
# The env vars a runtime client's wif_env may name must start with this (CS-521).
# wif_env_prefix = "FS_RUNTIME_WIF_"

# [[client]]
# client_id = "id1"
# wif_key = ""

# Retention for POST /fund idempotency records. Optional; these are the
# defaults. Records are held in memory only and are lost on restart.
# [idempotency]
# ttl_seconds = 600
# max_entries = 10000

# When present, funding transactions are broadcast through mapi-lite instead of
# the [blockchain_interface] above, and with interface_type = "mapi_lite" chain
# reads (balances, UTXOs) go there too. GET /ready then probes mapi-lite;
# GET /health stays a pure liveness check. Without the section, interface_type
# must be another one.
# base_url is required, and on mainnet and testnet so is miner_id_public_keys;
# total_timeout_seconds shows its default.
[mapi_lite]
base_url = "http://127.0.0.1:8080"
auth_token = "env:MAPI_AUTH_TOKEN"   # the token alone; sent as "Bearer <token>"
# The whole submit, retries included. Each attempt is mapi-lite's published
# submit ceiling plus 3s, and as many retries run as fit (CS-624).
# total_timeout_seconds = 45
# mapi-lite's miner-ID public key(s), hex: its GET /mapi/feeQuote minerId.
# Required on mainnet and testnet, where startup refuses it empty (CS-624);
# elsewhere, left empty, a response signed by any key is believed (CS-523).
miner_id_public_keys = []

# The fee the service pays on the transactions it builds. Optional; these are
# the defaults.
#
# The fee is ceil(tx_bytes * satoshis_per_kb / 1000), rounded up so rounding
# never underpays. An ordinary funding transaction -- one input, two outputs --
# is 226 bytes, so at 100 sat/KB it pays 23 satoshi. tx_bytes is the
# serialised size, counted as an upper bound, so the rate is never undercut.
#
# Before v4.3.0 this was hardcoded as ((tx_bytes / 1000) * 500) + 750, which
# charged 750 for that same transaction. Upgrading without setting these pays
# the lower rate.
#
# With [mapi_lite] configured, the rate is taken from its feeQuote and
# satoshis_per_kb becomes the fallback used before the first quote and whenever
# one cannot be had.
#
# Change too small to be worth an output is not paid back -- it stays in the
# transaction and the miner takes it as fee. The threshold for that is derived
# from the rate above rather than configured: it is the round-trip cost of a
# change output, max(1, 2 * ceil(182 * satoshis_per_kb / 1000)), which is 38
# satoshi at 100 sat/KB.
# [fees]
# satoshis_per_kb = 100
# A quoted rate above this is ignored, not clamped (CS-523).
# max_satoshis_per_kb = 1000

# Per-client caps on what POST /fund pays out (satoshi x no_of_outpoints).
# Off unless set; see docs/Configuration.md.
# [funding_limits]
# max_satoshis_per_request = 100000
# max_satoshis_per_period = 1000000
# period_seconds = 3600
